<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo de Fin de Séance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { club: '#ff2a5f' },
                    fontFamily: { sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #000; color: #fff; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .glass-panel { background: rgba(25, 25, 25, 0.65); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid #ff2a5f; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .ratio-9-16 { aspect-ratio: 9 / 16; max-height: 70vh; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 28px; width: 28px; border-radius: 50%; background: #ff2a5f; cursor: pointer; margin-top: -10px; box-shadow: 0 0 10px rgba(255,42,95,0.8); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 8px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden relative">

    <script>
        window.CONFIG = {
            CLUB_NAME: "FitClub Elite",
            CLUB_IG: "@FitClubElite",
            CLUB_TAGS: "#WorkoutDone #FitClubElite #NoExcuses",
            CADRE_URL: "cadre.png",
            LUNETTES_URL: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 256'><path fill='%23111' d='M32 128 c 0 -30 20 -64 80 -64 c 40 0 60 20 80 40 c 20 -20 40 -40 80 -40 c 60 0 80 34 80 64 c 0 40 -40 80 -80 80 c -40 0 -60 -20 -80 -40 c -20 20 -40 40 -80 40 c -40 0 -80 -40 -80 -80 z'/><path fill='%23333' d='M16 96 L496 96 L496 112 L16 112 Z'/></svg>",
        };
    </script>

    <!-- ÉCRAN 1 : CAPTURE -->
    <main id="screen-capture" class="flex-1 flex flex-col items-center justify-center p-6 relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Fin de Séance ! 💦</h1>
            <p class="text-gray-400">Prends ton selfie pour valider l'entraînement.</p>
        </div>
        <div class="w-full max-w-sm ratio-9-16 border-2 border-dashed border-gray-600 rounded-3xl flex items-center justify-center relative mb-8 overflow-hidden bg-gray-900">
            <svg class="w-16 h-16 text-gray-500 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        </div>
        <label for="file-input" class="w-full max-w-sm bg-club hover:bg-rose-600 text-white font-bold py-4 px-6 rounded-2xl shadow-[0_0_20px_rgba(255,42,95,0.4)] flex items-center justify-center gap-2 text-lg cursor-pointer">
            📸 Prendre ma photo
        </label>
        <input type="file" id="file-input" accept="image/*" class="hidden">
    </main>

    <!-- ÉCRAN DE CHARGEMENT -->
    <div id="screen-loading" class="hidden absolute inset-0 bg-black/95 z-50 flex flex-col items-center justify-center">
        <div class="loader mb-4"></div>
        <p class="text-lg font-medium text-white" id="loading-text">Optimisation...</p>
    </div>

    <!-- ÉCRAN 2 : RÉSULTAT -->
    <main id="screen-result" class="hidden flex-1 flex flex-col overflow-y-auto hide-scroll pb-10 z-10">
        <div class="relative w-full aspect-[9/16] bg-gray-900 shadow-2xl overflow-hidden">
            <img id="preview-image" class="w-full h-full object-contain" src="" alt="Aperçu">
            <button id="btn-retake" class="absolute top-4 left-4 glass-panel p-3 rounded-full text-white shadow-lg z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
            <div class="absolute bottom-6 left-0 w-full px-6 z-20">
                <div class="glass-panel p-4 rounded-2xl flex flex-col items-center">
                    <span id="slider-label" class="text-sm font-bold text-club mb-2 uppercase tracking-wide animate-pulse">✨ Glisse pour le mode FUN 🕶️</span>
                    <input type="range" id="fun-slider" min="0" max="150" value="0">
                </div>
            </div>
        </div>

        <div class="px-5 mt-4 relative z-20">
            <div class="glass-panel rounded-3xl p-6 shadow-2xl">
                <div class="text-center mb-5">
                    <h2 class="text-xl font-bold leading-tight">🔥 Tag <span id="display-ig" class="text-club"></span> en Story !</h2>
                </div>
                <button id="btn-share" class="w-full bg-gradient-to-r from-club to-rose-600 text-white font-bold py-4 rounded-2xl mb-3 flex items-center justify-center gap-2 text-lg">
                    🚀 Partager ma Story Instagram
                </button>
                <button id="btn-copy-tags" class="w-full bg-white/5 border border-white/10 text-white font-medium py-3 rounded-xl mb-4 flex items-center justify-center gap-2">
                    📋 <span id="copy-text">Copier les tags</span>
                </button>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
        ✅ Copié avec succès !
    </div>

    <!-- CANVAS CACHÉS -->
    <canvas id="base-photo-canvas" width="1080" height="1920" class="hidden"></canvas>
    <canvas id="final-render-canvas" width="1080" height="1920" class="hidden"></canvas>

    <!-- TYPE MODULE ESSENTIEL POUR L'IMPORT DYNAMIQUE -->
    <script type="module">
        document.getElementById('display-ig').textContent = window.CONFIG.CLUB_IG;

        // Variables Globales (Zero IA chargée ici)
        let cadreImg = new Image();
        let lunettesImg = new Image();
        let currentFaces = [];
        let aiLoaded = false;
        let aiLoadingInProgress = false;
        let faceDetector = null;

        const C_WIDTH = 1080;
        const C_HEIGHT = 1920;
        const baseCanvas = document.getElementById('base-photo-canvas');
        const baseCtx = baseCanvas.getContext('2d', { willReadFrequently: true });
        const finalCanvas = document.getElementById('final-render-canvas');
        const finalCtx = finalCanvas.getContext('2d');
        const previewImage = document.getElementById('preview-image');
        const sliderLabel = document.getElementById('slider-label');

        lunettesImg.src = window.CONFIG.LUNETTES_URL;
        cadreImg.crossOrigin = "anonymous";
        cadreImg.src = window.CONFIG.CADRE_URL;

        // ==========================================
        // ETAPE 3 : IA "ON DEMAND" (IMPORT INJECTÉ)
        // ==========================================
        document.getElementById('fun-slider').addEventListener('input', async (e) => {
            const funLevel = parseInt(e.target.value);

            if (funLevel > 0 && !aiLoaded && !aiLoadingInProgress) {
                aiLoadingInProgress = true;
                sliderLabel.textContent = "⏳ Initialisation IA (Patientez)...";
                
                try {
                    // 1. Injection du module (Contourne le blocage Safari)
                    if (!window.FaceDetector) {
                        const script = document.createElement('script');
                        script.type = 'module';
                        script.textContent = `
                            import { FaceDetector, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js";
                            window.FaceDetector = FaceDetector;
                            window.FilesetResolver = FilesetResolver;
                        `;
                        document.head.appendChild(script);

                        // Attendre que le script soit bien chargé
                        await new Promise((resolve, reject) => {
                            let attempts = 0;
                            const interval = setInterval(() => {
                                if (window.FaceDetector) {
                                    clearInterval(interval);
                                    resolve();
                                }
                                attempts++;
                                if (attempts > 100) { // Timeout de 10 secondes
                                    clearInterval(interval);
                                    reject(new Error("Réseau trop lent"));
                                }
                            }, 100);
                        });
                    }

                    sliderLabel.textContent = "⏳ Téléchargement du modèle...";

                    // 2. Chargement du WASM et du Modèle
                    const vision = await window.FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    
                    faceDetector = await window.FaceDetector.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
                            delegate: "CPU"
                        },
                        runningMode: "IMAGE"
                    });

                    sliderLabel.textContent = "⏳ Analyse du visage...";

                    // 3. Détection sur le visage
                    const detections = faceDetector.detect(baseCanvas);
                    currentFaces = detections.detections || [];
                    
                    if (currentFaces.length === 0) {
                        sliderLabel.textContent = "⚠️ Aucun visage détecté !";
                        setTimeout(() => { sliderLabel.textContent = "✨ Glisse pour le mode FUN 🕶️"; }, 3000);
                    } else {
                        sliderLabel.textContent = "😎 Ajuste la taille !";
                    }
                    
                    aiLoaded = true;
                } catch (err) {
                    // Affichage précis de l'erreur pour savoir ce qui bloque
                    const errorMsg = err.message ? err.message.substring(0, 25) : "Erreur inconnue";
                    sliderLabel.textContent = "❌ " + errorMsg;
                    console.error("Erreur IA:", err);
                }
                aiLoadingInProgress = false;
            }

            // 4. Mise à jour du rendu si on glisse
            if (aiLoaded || funLevel === 0) {
                if (funLevel === 0) sliderLabel.textContent = "✨ Glisse pour le mode FUN 🕶️";
                else if (aiLoaded && currentFaces.length > 0) sliderLabel.textContent = "😎 Ajuste la taille !";
                requestAnimationFrame(() => updateFinalRender(funLevel));
            }
        });

        // ==========================================
        // ETAPE 4 : BOUTONS ET PARTAGE
        // ==========================================
        document.getElementById('btn-retake').addEventListener('click', () => {
            document.getElementById('file-input').value = '';
            document.getElementById('screen-result').classList.add('hidden');
            document.getElementById('screen-capture').classList.remove('hidden');
        });

        document.getElementById('btn-share').addEventListener('click', async () => {
            const dataUrl = previewImage.src;
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                const file = new File([blob], 'workout.jpg', { type: 'image/jpeg' });
                
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        title: window.CONFIG.CLUB_NAME,
                        text: `Fin de séance ! 🔥 ${window.CONFIG.CLUB_IG} ${window.CONFIG.CLUB_TAGS}`,
                        files: [file]
                    });
                } else {
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = 'workout.jpg';
                    a.click();
                }
            } catch (err) {}
        });

        document.getElementById('btn-copy-tags').addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(`${window.CONFIG.CLUB_IG} ${window.CONFIG.CLUB_TAGS}`);
                const toast = document.getElementById('toast');
                toast.classList.remove('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => toast.classList.add('opacity-0', 'translate-y-[-20px]'), 2000);
            } catch (err) {}
        });
    </script>
</body>
</html>
