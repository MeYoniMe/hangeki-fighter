<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Post-Séance · Club Selfie</title>
<meta name="theme-color" content="#07070B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   Palette   : void #07070B, ink #0F0F16, glass rgba(255,255,255,.06)
               pulse (accent) #FF4159, current (accent 2) #7C5CFF
               text-hi #F5F5F8, text-lo #93939E
   Type      : display = "Bebas Neue" (poster energy, used sparingly)
                body    = "Inter"
   Signature : the "pulse line" — a single heartbeat/ECG stroke that
               runs across the top bar and re-triggers as a shutter
               flash + share confirmation. Ties the sport-club energy
               to the UI without leaning on generic gradients.
   ============================================================ */
:root{
  --void:#07070B;
  --ink:#0F0F16;
  --glass:rgba(255,255,255,.06);
  --glass-brd:rgba(255,255,255,.12);
  --pulse:#FF4159;
  --pulse-dim:#FF415933;
  --current:#7C5CFF;
  --text-hi:#F5F5F8;
  --text-lo:#93939E;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  height:100%;
  margin:0;
  background:var(--void);
  color:var(--text-hi);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
}
button{font-family:inherit;}
.display{
  font-family:'Bebas Neue',system-ui,sans-serif;
  letter-spacing:.03em;
}
.app{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}
.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  opacity:0;
  pointer-events:none;
  transform:translateY(12px);
  transition:opacity .45s ease, transform .45s ease;
}
.screen.active{
  opacity:1;
  pointer-events:auto;
  transform:translateY(0);
}

/* ---------- pulse line (signature element) ---------- */
.pulse-bar{
  padding-top:calc(var(--safe-t) + 14px);
  height:calc(46px + var(--safe-t));
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  flex-shrink:0;
}
.pulse-bar svg{width:120px;height:20px;overflow:visible;}
.pulse-bar path{
  fill:none;
  stroke:var(--pulse);
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
  stroke-dasharray:160;
  stroke-dashoffset:160;
  animation:draw-pulse 2.6s ease-in-out infinite;
}
@keyframes draw-pulse{
  0%{stroke-dashoffset:160;}
  35%{stroke-dashoffset:0;}
  70%{stroke-dashoffset:0;opacity:1;}
  100%{stroke-dashoffset:0;opacity:0;}
}
.brand-label{
  position:absolute;
  right:20px;
  top:calc(var(--safe-t) + 16px);
  font-size:11px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-lo);
}

/* ---------- CAPTURE SCREEN ---------- */
#screen-capture{align-items:center;justify-content:space-between;padding-bottom:calc(28px + var(--safe-b));}
.capture-hero{
  flex:1;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:0 28px;
  text-align:center;
  gap:22px;
}
.capture-frame{
  position:relative;
  width:min(76vw,300px);
  aspect-ratio:9/16;
  border-radius:28px;
  border:1.5px dashed var(--glass-brd);
  background:
    radial-gradient(120% 90% at 50% 15%, rgba(124,92,255,.14), transparent 60%),
    var(--ink);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.capture-frame::before{
  content:"";
  position:absolute;
  inset:14%;
  border:1px solid rgba(255,255,255,.08);
  border-radius:18px;
}
.capture-icon{
  width:56px;height:56px;
  border-radius:50%;
  border:1.5px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:center;
  color:var(--text-lo);
}
h1.headline{
  font-size:15px;
  font-weight:700;
  margin:0;
  color:var(--text-hi);
}
p.sub{
  font-size:13px;
  color:var(--text-lo);
  margin:0;
  max-width:280px;
  line-height:1.5;
}
.controls-block{
  width:100%;
  padding:0 24px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:16px;
}
.toggle-row{
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  padding:9px 16px;
  border-radius:100px;
  font-size:12.5px;
  color:var(--text-lo);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.switch{
  position:relative;
  width:38px;height:22px;
  border-radius:100px;
  background:rgba(255,255,255,.14);
  flex-shrink:0;
  transition:background .25s ease;
  border:none;
  cursor:pointer;
}
.switch::after{
  content:"";
  position:absolute;
  top:2px;left:2px;
  width:18px;height:18px;
  border-radius:50%;
  background:#fff;
  transition:transform .25s cubic-bezier(.4,0,.2,1);
}
.switch[aria-checked="true"]{background:var(--pulse);}
.switch[aria-checked="true"]::after{transform:translateX(16px);}
.switch:focus-visible{outline:2px solid var(--current);outline-offset:3px;}

.btn-primary{
  width:100%;
  max-width:340px;
  padding:18px 22px;
  border:none;
  border-radius:20px;
  background:var(--text-hi);
  color:#0A0A0F;
  font-size:16px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease;
}
.btn-primary:active{transform:scale(.97);}
.btn-primary:focus-visible{outline:2px solid var(--current);outline-offset:3px;}
.btn-primary.accent{
  background:var(--pulse);
  color:#fff;
  box-shadow:0 10px 30px -8px var(--pulse-dim);
}
.btn-secondary{
  width:100%;
  max-width:340px;
  padding:15px 22px;
  border-radius:18px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  color:var(--text-hi);
  font-size:14.5px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
}
.btn-secondary:focus-visible{outline:2px solid var(--current);outline-offset:3px;}
.btn-ghost{
  background:transparent;
  border:none;
  color:var(--text-lo);
  font-size:13px;
  font-weight:600;
  padding:12px;
  cursor:pointer;
}
.btn-ghost:focus-visible{outline:2px solid var(--current);outline-offset:3px;}
#file-input{display:none;}

/* ---------- RESULT SCREEN ---------- */
#screen-result{padding-bottom:calc(20px + var(--safe-b));}
.result-stage{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 24px 4px;
  min-height:0;
}
.canvas-shell{
  position:relative;
  height:100%;
  max-height:100%;
  aspect-ratio:9/16;
  border-radius:26px;
  overflow:hidden;
  background:var(--ink);
  box-shadow:0 30px 60px -20px rgba(0,0,0,.7);
}
#output-canvas{width:100%;height:100%;display:block;object-fit:cover;}
.flash{
  position:absolute;inset:0;
  background:#fff;
  opacity:0;
  pointer-events:none;
}
.flash.go{animation:flash-anim .5s ease-out;}
@keyframes flash-anim{0%{opacity:.9;}100%{opacity:0;}}

.viral-block{
  margin:14px 24px 6px;
  padding:14px 16px;
  border-radius:18px;
  background:linear-gradient(135deg, rgba(255,65,89,.14), rgba(124,92,255,.10));
  border:1px solid rgba(255,65,89,.25);
  display:flex;
  align-items:center;
  gap:12px;
}
.viral-block .emoji{font-size:20px;flex-shrink:0;}
.viral-block p{margin:0;font-size:13px;line-height:1.4;color:var(--text-hi);font-weight:500;}
.viral-block strong{color:var(--pulse);}

.tag-row{
  margin:0 24px 4px;
  display:flex;
  gap:10px;
}
.tag-copy{
  flex:1;
  padding:12px 14px;
  border-radius:14px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  color:var(--text-hi);
  font-size:12.5px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  cursor:pointer;
  transition:background .2s ease;
}
.tag-copy.copied{background:rgba(124,92,255,.22);border-color:var(--current);}
.tag-link{
  padding:12px 16px;
  border-radius:14px;
  background:var(--glass);
  border:1px solid var(--glass-brd);
  color:var(--text-lo);
  font-size:12.5px;
  font-weight:600;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;
  flex-shrink:0;
}

.result-actions{
  padding:14px 24px 0;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

.status-msg{
  text-align:center;
  font-size:11.5px;
  color:var(--text-lo);
  padding:8px 24px 0;
  min-height:16px;
}

.spinner{
  width:34px;height:34px;
  border-radius:50%;
  border:2.5px solid var(--glass-brd);
  border-top-color:var(--pulse);
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-veil{
  position:absolute;inset:0;
  background:rgba(7,7,11,.72);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  z-index:5;
  transition:opacity .3s ease;
}
.loading-veil span{font-size:12.5px;color:var(--text-lo);font-weight:600;}
.hidden{display:none !important;}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;}
}
</style>
</head>
<body>

<div class="app">

  <!-- ============ SCREEN 1 · CAPTURE ============ -->
  <section class="screen active" id="screen-capture">
    <div class="pulse-bar">
      <svg viewBox="0 0 120 20"><path d="M0,10 L28,10 L34,2 L42,18 L50,6 L56,10 L120,10"/></svg>
    </div>
    <span class="brand-label" id="club-label"></span>

    <div class="capture-hero">
      <div class="capture-frame">
        <div class="capture-icon">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 8a2 2 0 0 1 2-2h1.2a1 1 0 0 0 .86-.5l.68-1.14A1 1 0 0 1 9.6 4h4.8a1 1 0 0 1 .86.36l.68 1.14a1 1 0 0 0 .86.5H18a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8z"/><circle cx="12" cy="13" r="3.4"/></svg>
        </div>
      </div>
      <div>
        <h1 class="headline">Séance terminée. Immortalise-la.</h1>
        <p class="sub">Selfie seul ou à plusieurs — les lunettes et le cadre du club sont ajoutés automatiquement.</p>
      </div>
    </div>

    <div class="controls-block">
      <div class="toggle-row">
        <span>😎 Effet lunettes automatique</span>
        <button class="switch" id="glasses-toggle" role="switch" aria-checked="true" aria-label="Activer l'effet lunettes"></button>
      </div>
      <button class="btn-primary accent" id="capture-btn">
        📸 Prendre ma photo
      </button>
      <input type="file" id="file-input" accept="image/*" capture="user">
    </div>
  </section>

  <!-- ============ SCREEN 2 · RESULT / HUB VIRAL ============ -->
  <section class="screen" id="screen-result">
    <div class="pulse-bar">
      <svg viewBox="0 0 120 20"><path d="M0,10 L28,10 L34,2 L42,18 L50,6 L56,10 L120,10"/></svg>
    </div>

    <div class="result-stage">
      <div class="canvas-shell">
        <canvas id="output-canvas" width="1080" height="1920"></canvas>
        <div class="flash" id="flash"></div>
        <div class="loading-veil" id="loading-veil">
          <div class="spinner"></div>
          <span id="loading-label">Analyse des visages…</span>
        </div>
      </div>
    </div>

    <div class="viral-block">
      <span class="emoji">🔥</span>
      <p>Tag <strong id="viral-handle">@nomduclub</strong> en Story pour être reposté sur la page officielle du club !</p>
    </div>

    <div class="tag-row">
      <button class="tag-copy" id="copy-tags-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
        <span id="copy-tags-label">Copier les tags du club</span>
      </button>
      <a class="tag-link" id="insta-link" href="#" target="_blank" rel="noopener">Instagram</a>
    </div>

    <div class="status-msg" id="status-msg">&nbsp;</div>

    <div class="result-actions">
      <button class="btn-primary accent" id="share-btn">🚀 Partager ma Story Instagram</button>
      <button class="btn-secondary" id="save-btn">💾 Enregistrer la photo</button>
      <button class="btn-ghost" id="retry-btn">🔄 Reprendre</button>
    </div>
  </section>

</div>

<script>
/* ============================================================
   CONFIG — personnalisation rapide (pseudos, hashtags, lieu)
   ============================================================ */
const CLUB_CONFIG = {
  clubName:        "Nom du Club",          // ex: "CrossFit Arlon"
  instagramHandle: "@nomduclub",           // le @ du club
  instagramUrl:    "https://instagram.com/nomduclub",
  hashtags:        ["#NomDuClub", "#WorkoutDone", "#TeamNomDuClub"],
  location:        "Arlon, Belgique",       // affiché dans le texte de partage
  shareMessage:    "Séance terminée 💪 Merci"
};

/*
  Assets externes optionnels (à déposer à côté de index.html sur GitHub Pages) :
    - "cadre.png"    → cadre PNG officiel transparent 1080x1920. S'il est absent,
                        un cadre généré proceduralement (glassmorphism + nom du club)
                        est utilisé à la place, donc l'app reste 100% autonome.
    - "lunettes.png" → paire de lunettes PNG transparente (fond alpha), orientée
                        pour des yeux horizontaux. S'il est absent, une paire de
                        lunettes vectorielle dessinée en Canvas est utilisée.
*/
const ASSET_FRAME    = "cadre.png";
const ASSET_GLASSES  = "lunettes.png";

const CANVAS_W = 1080, CANVAS_H = 1920;

/* ============================================================
   DOM refs
   ============================================================ */
const screenCapture   = document.getElementById('screen-capture');
const screenResult    = document.getElementById('screen-result');
const fileInput       = document.getElementById('file-input');
const captureBtn      = document.getElementById('capture-btn');
const glassesToggle   = document.getElementById('glasses-toggle');
const outputCanvas    = document.getElementById('output-canvas');
const ctx             = outputCanvas.getContext('2d');
const loadingVeil     = document.getElementById('loading-veil');
const loadingLabel    = document.getElementById('loading-label');
const flashEl         = document.getElementById('flash');
const shareBtn        = document.getElementById('share-btn');
const saveBtn         = document.getElementById('save-btn');
const retryBtn        = document.getElementById('retry-btn');
const copyTagsBtn     = document.getElementById('copy-tags-btn');
const copyTagsLabel   = document.getElementById('copy-tags-label');
const statusMsg       = document.getElementById('status-msg');
const clubLabel       = document.getElementById('club-label');
const viralHandle     = document.getElementById('viral-handle');
const instaLink       = document.getElementById('insta-link');

outputCanvas.width = CANVAS_W;
outputCanvas.height = CANVAS_H;

let glassesEnabled = true;
let currentObjectUrl = null;
let renderedBlob = null;
let faceMeshInstance = null;
let faceMeshReady = null;

/* ============================================================
   Personnalisation appliquée à l'UI
   ============================================================ */
clubLabel.textContent = CLUB_CONFIG.clubName;
viralHandle.textContent = CLUB_CONFIG.instagramHandle;
instaLink.href = CLUB_CONFIG.instagramUrl;
instaLink.textContent = "Visiter notre Instagram";

/* ============================================================
   Navigation entre écrans
   ============================================================ */
function showScreen(el){
  [screenCapture, screenResult].forEach(s => s.classList.remove('active'));
  el.classList.add('active');
}

/* ============================================================
   Toggle lunettes
   ============================================================ */
glassesToggle.addEventListener('click', () => {
  glassesEnabled = !glassesEnabled;
  glassesToggle.setAttribute('aria-checked', String(glassesEnabled));
});

/* ============================================================
   Capture — déclenche l'input file (pas de popup bloquante iOS
   car déclenché directement par le clic utilisateur)
   ============================================================ */
captureBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  await handleNewPhoto(file);
  fileInput.value = ""; // permet de reprendre la même photo si besoin
});

/* ============================================================
   MediaPipe FaceMesh — chargement paresseux (au premier besoin)
   ============================================================ */
function loadScript(src){
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = src;
    s.crossOrigin = "anonymous";
    s.onload = resolve;
    s.onerror = () => reject(new Error("Échec du chargement: " + src));
    document.head.appendChild(s);
  });
}

async function ensureFaceMesh(){
  if (faceMeshReady) return faceMeshReady;
  faceMeshReady = (async () => {
    try{
      if (typeof FaceMesh === 'undefined'){
        await loadScript("https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js");
      }
      faceMeshInstance = new FaceMesh({
        locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`
      });
      faceMeshInstance.setOptions({
        maxNumFaces: 6,
        refineLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
      return true;
    }catch(err){
      console.warn("FaceMesh indisponible, l'effet lunettes sera désactivé pour cette photo.", err);
      return false;
    }
  })();
  return faceMeshReady;
}

function detectFaces(imageEl){
  return new Promise((resolve) => {
    let settled = false;
    const timeout = setTimeout(() => { if(!settled){ settled = true; resolve([]); } }, 6000);
    faceMeshInstance.onResults((results) => {
      if (settled) return;
      settled = true;
      clearTimeout(timeout);
      resolve(results.multiFaceLandmarks || []);
    });
    faceMeshInstance.send({ image: imageEl }).catch(() => {
      if (!settled){ settled = true; clearTimeout(timeout); resolve([]); }
    });
  });
}

/* ============================================================
   Pipeline principal : photo -> recadrage -> visages -> lunettes
   -> cadre -> canvas final
   ============================================================ */
async function handleNewPhoto(file){
  showScreen(screenResult);
  setLoading(true, "Préparation de l'image…");
  statusMsg.textContent = "";

  try{
    const imgUrl = URL.createObjectURL(file);
    if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
    currentObjectUrl = imgUrl;

    const img = await loadImage(imgUrl);

    // 1) Recadrage "cover" centré sans déformation
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
    drawCover(ctx, img, CANVAS_W, CANVAS_H);

    // 2) Détection des visages + lunettes
    if (glassesEnabled){
      setLoading(true, "Détection des visages…");
      const ready = await ensureFaceMesh();
      if (ready){
        // MediaPipe travaille sur l'image source ; on convertit les landmarks
        // normalisés vers les coordonnées du canvas de sortie via le même
        // mapping "cover" que l'étape 1.
        const faces = await detectFaces(img);
        if (faces.length){
          const geom = coverGeometry(img.naturalWidth, img.naturalHeight, CANVAS_W, CANVAS_H);
          setLoading(true, `Ajustement de ${faces.length} paire${faces.length>1?"s":""} de lunettes…`);
          await drawGlassesOnFaces(ctx, faces, geom);
        }
      }
    }

    // 3) Cadre officiel du club (par-dessus tout)
    setLoading(true, "Application du cadre du club…");
    await drawClubFrame(ctx, CLUB_CONFIG.clubName);

    // Petit flash à la fin du rendu, façon obturateur
    flashEl.classList.remove('go');
    void flashEl.offsetWidth;
    flashEl.classList.add('go');

    renderedBlob = await canvasToBlob(outputCanvas);
    setLoading(false);
  }catch(err){
    console.error(err);
    setLoading(false);
    statusMsg.textContent = "Un souci est survenu pendant le montage. Réessaie ta photo.";
  }
}

function loadImage(url){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = url;
  });
}

function setLoading(isLoading, label){
  loadingVeil.classList.toggle('hidden', !isLoading);
  if (label) loadingLabel.textContent = label;
}

/* ---- géométrie "object-fit: cover" ---- */
function coverGeometry(srcW, srcH, dstW, dstH){
  const scale = Math.max(dstW / srcW, dstH / srcH);
  const drawW = srcW * scale;
  const drawH = srcH * scale;
  const dx = (dstW - drawW) / 2;
  const dy = (dstH - drawH) / 2;
  return { scale, dx, dy, drawW, drawH };
}

function drawCover(context, img, dstW, dstH){
  const g = coverGeometry(img.naturalWidth, img.naturalHeight, dstW, dstH);
  context.drawImage(img, g.dx, g.dy, g.drawW, g.drawH);
}

/* ---- lunettes : mapping des landmarks + dessin ---- */
async function drawGlassesOnFaces(context, faceLandmarksList, geom){
  let glassesImg = null;
  try{ glassesImg = await loadImage(ASSET_GLASSES); }catch(e){ glassesImg = null; }

  for (const landmarks of faceLandmarksList){
    // yeux (repères MediaPipe FaceMesh)
    const rOuter = landmarks[33],  rInner = landmarks[133];
    const lOuter = landmarks[263], lInner = landmarks[362];
    if (!rOuter || !rInner || !lOuter || !lInner) continue;

    const toCanvas = (pt) => ({
      x: pt.x * geom.drawW + geom.dx,
      y: pt.y * geom.drawH + geom.dy
    });

    const rEye = midpoint(toCanvas(rOuter), toCanvas(rInner));
    const lEye = midpoint(toCanvas(lOuter), toCanvas(lInner));
    const center = midpoint(rEye, lEye);
    const dx = lEye.x - rEye.x;
    const dy = lEye.y - rEye.y;
    const eyeDist = Math.hypot(dx, dy);
    const angle = Math.atan2(dy, dx);

    const glassesWidth = eyeDist * 2.35;
    const glassesHeight = glassesWidth * (glassesImg ? (glassesImg.naturalHeight / glassesImg.naturalWidth) : 0.42);

    context.save();
    context.translate(center.x, center.y);
    context.rotate(angle);
    if (glassesImg){
      context.drawImage(glassesImg, -glassesWidth/2, -glassesHeight/2, glassesWidth, glassesHeight);
    }else{
      drawVectorSunglasses(context, glassesWidth, glassesHeight);
    }
    context.restore();
  }
}

function midpoint(a, b){ return { x: (a.x+b.x)/2, y: (a.y+b.y)/2 }; }

/* Lunettes vectorielles de secours (aucun asset externe requis) */
function drawVectorSunglasses(context, w, h){
  const lensR = h * 1.05;
  const gap = w * 0.16;

  context.fillStyle = "rgba(10,10,14,0.94)";
  context.strokeStyle = "rgba(255,255,255,0.55)";
  context.lineWidth = Math.max(2, w * 0.012);

  [-1, 1].forEach((side) => {
    const cx = side * (w/2 - gap/2 - lensR);
    context.beginPath();
    context.ellipse(cx, 0, lensR, lensR*0.82, 0, 0, Math.PI*2);
    context.fill();
    context.stroke();
  });

  // pont central
  context.beginPath();
  context.moveTo(-gap/2, 0);
  context.lineTo(gap/2, 0);
  context.lineWidth = Math.max(3, w * 0.02);
  context.strokeStyle = "rgba(20,20,24,0.95)";
  context.stroke();

  // branches
  context.lineWidth = Math.max(2, w * 0.014);
  context.strokeStyle = "rgba(10,10,14,0.9)";
  context.beginPath();
  context.moveTo(w/2 - gap/2 - 2, 0);
  context.lineTo(w/2 + w*0.14, -h*0.06);
  context.stroke();
  context.beginPath();
  context.moveTo(-(w/2 - gap/2 - 2), 0);
  context.lineTo(-(w/2 + w*0.14), -h*0.06);
  context.stroke();

  // reflet
  context.fillStyle = "rgba(255,255,255,0.18)";
  [-1, 1].forEach((side) => {
    context.beginPath();
    context.ellipse(side * (w/2 - gap/2 - lensR) - side*lensR*0.25, -lensR*0.28, lensR*0.28, lensR*0.14, -0.4*side, 0, Math.PI*2);
    context.fill();
  });
}

/* ---- cadre officiel : PNG externe si présent, sinon procédural ---- */
async function drawClubFrame(context, clubName){
  try{
    const frameImg = await loadImage(ASSET_FRAME);
    context.drawImage(frameImg, 0, 0, CANVAS_W, CANVAS_H);
    return;
  }catch(e){
    // pas de cadre.png fourni → cadre généré (garde l'app 100% autonome)
  }

  // bandeau glassmorphism en pied de page
  const bandH = 260;
  const grad = context.createLinearGradient(0, CANVAS_H - bandH, 0, CANVAS_H);
  grad.addColorStop(0, "rgba(7,7,11,0)");
  grad.addColorStop(0.45, "rgba(7,7,11,0.75)");
  grad.addColorStop(1, "rgba(7,7,11,0.92)");
  context.fillStyle = grad;
  context.fillRect(0, CANVAS_H - bandH, CANVAS_W, bandH);

  // ligne d'accent façon pulse
  context.strokeStyle = "#FF4159";
  context.lineWidth = 5;
  context.beginPath();
  context.moveTo(64, CANVAS_H - bandH + 28);
  context.lineTo(CANVAS_W - 64, CANVAS_H - bandH + 28);
  context.stroke();

  context.fillStyle = "#F5F5F8";
  context.font = "700 64px Inter, system-ui, sans-serif";
  context.textBaseline = "alphabetic";
  context.fillText(clubName, 64, CANVAS_H - 130);

  context.fillStyle = "rgba(245,245,248,0.65)";
  context.font = "600 30px Inter, system-ui, sans-serif";
  context.fillText(CLUB_CONFIG.hashtags.join("  "), 64, CANVAS_H - 78);

  // cadre extérieur fin
  context.strokeStyle = "rgba(255,255,255,0.14)";
  context.lineWidth = 3;
  context.strokeRect(10, 10, CANVAS_W - 20, CANVAS_H - 20);
}

function canvasToBlob(canvas){
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.94));
}

/* ============================================================
   Partage viral
   ============================================================ */
function buildShareText(){
  return `${CLUB_CONFIG.shareMessage} ${CLUB_CONFIG.instagramHandle} 💪 ${CLUB_CONFIG.hashtags.join(" ")} 📍${CLUB_CONFIG.location}`;
}

shareBtn.addEventListener('click', async () => {
  if (!renderedBlob){ statusMsg.textContent = "La photo n'est pas encore prête."; return; }

  const fileToShare = new File([renderedBlob], "seance-club.jpg", { type: "image/jpeg" });
  const shareText = buildShareText();

  const canShareFiles = navigator.canShare && navigator.canShare({ files: [fileToShare] });

  if (navigator.share && canShareFiles){
    try{
      await navigator.share({
        files: [fileToShare],
        text: shareText,
        title: CLUB_CONFIG.clubName
      });
      statusMsg.textContent = "Merci pour le partage ! 🙌";
    }catch(err){
      if (err && err.name !== 'AbortError'){
        fallbackDownload(fileToShare, shareText);
      }
    }
  }else{
    fallbackDownload(fileToShare, shareText);
  }
});

function fallbackDownload(fileObj, shareText){
  const url = URL.createObjectURL(fileObj);
  const a = document.createElement('a');
  a.href = url;
  a.download = "seance-club.jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  navigator.clipboard && navigator.clipboard.writeText(shareText).catch(()=>{});
  statusMsg.textContent = "Photo téléchargée. Maintiens appuyé sur l'image pour l'enregistrer, puis colle le texte copié en légende Instagram.";
}

saveBtn.addEventListener('click', () => {
  if (!renderedBlob){ statusMsg.textContent = "La photo n'est pas encore prête."; return; }
  const url = URL.createObjectURL(renderedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = "seance-club.jpg";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  statusMsg.textContent = "Photo enregistrée sur l'appareil.";
});

copyTagsBtn.addEventListener('click', async () => {
  const text = `${CLUB_CONFIG.instagramHandle} ${CLUB_CONFIG.hashtags.join(" ")}`;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
  }
  copyTagsBtn.classList.add('copied');
  const prevLabel = copyTagsLabel.textContent;
  copyTagsLabel.textContent = "Copié ✓";
  setTimeout(() => {
    copyTagsBtn.classList.remove('copied');
    copyTagsLabel.textContent = prevLabel;
  }, 1800);
});

retryBtn.addEventListener('click', () => {
  if (currentObjectUrl){ URL.revokeObjectURL(currentObjectUrl); currentObjectUrl = null; }
  renderedBlob = null;
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  statusMsg.textContent = "";
  showScreen(screenCapture);
});
