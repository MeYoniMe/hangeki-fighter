<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo de Fin de Séance</title>
    
    <!-- Tailwind CSS pour un design moderne et rapide -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuration Tailwind pour le mode sombre "OLED" -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        club: '#ff2a5f',
                    },
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #000;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: none;
        }
        
        .glass-panel {
            background: rgba(25, 25, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hide-scroll::-webkit-scrollbar {
            display: none;
        }

        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #ff2a5f;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .ratio-9-16 {
            aspect-ratio: 9 / 16;
            max-height: 60vh;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #ff2a5f;
            cursor: pointer;
            margin-top: -10px;
            box-shadow: 0 0 10px rgba(255,42,95,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: rgba(255,255,255,0.2);
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden relative">

    <script>
        // --- ZONE DE PERSONNALISATION ---
        const CONFIG = {
            CLUB_NAME: "FitClub Elite",
            CLUB_IG: "@FitClubElite",
            CLUB_TAGS: "#WorkoutDone #FitClubElite #NoExcuses",
            CADRE_URL: "cadre.png",
            LUNETTES_URL: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 256'><path fill='%23111' d='M32 128 c 0 -30 20 -64 80 -64 c 40 0 60 20 80 40 c 20 -20 40 -40 80 -40 c 60 0 80 34 80 64 c 0 40 -40 80 -80 80 c -40 0 -60 -20 -80 -40 c -20 20 -40 40 -80 40 c -40 0 -80 -40 -80 -80 z'/><path fill='%23333' d='M16 96 L496 96 L496 112 L16 112 Z'/></svg>",
        };
    </script>

    <!-- ÉCRAN 1 : CAPTURE -->
    <main id="screen-capture" class="flex-1 flex flex-col items-center justify-center p-6 relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold tracking-tight mb-2">Fin de Séance ! 💦</h1>
            <p class="text-gray-400">Prends ton selfie pour valider l'entraînement.</p>
        </div>

        <div class="w-full max-w-sm ratio-9-16 border-2 border-dashed border-gray-600 rounded-3xl flex items-center justify-center relative mb-8 overflow-hidden pointer-events-none">
            <div class="absolute inset-0 bg-gradient-to-b from-transparent to-club opacity-10"></div>
            <svg class="w-16 h-16 text-gray-500 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
        </div>

        <input type="file" id="file-input" accept="image/*" class="hidden">
        <label for="file-input" class="w-full max-w-sm bg-club hover:bg-rose-600 text-white font-bold py-4 px-6 rounded-2xl shadow-[0_0_20px_rgba(255,42,95,0.4)] transition-all transform hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 text-lg cursor-pointer">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            </svg>
            📸 Prendre ma photo
        </label>
    </main>

    <!-- ÉCRAN DE CHARGEMENT -->
    <div id="screen-loading" class="hidden absolute inset-0 bg-black/90 z-50 flex flex-col items-center justify-center backdrop-blur-sm">
        <div class="loader mb-4"></div>
        <p class="text-lg font-medium text-white" id="loading-text">Création de l'image...</p>
        <p class="text-sm text-gray-400 mt-2">Traitement local sécurisé</p>
    </div>

    <!-- ÉCRAN 2 : RÉSULTAT -->
    <main id="screen-result" class="hidden flex-1 flex flex-col overflow-y-auto hide-scroll pb-10 z-10">
        
        <div class="relative w-full aspect-[9/16] bg-gray-900 shadow-2xl flex-shrink-0">
            <img id="preview-image" class="w-full h-full object-contain" src="" alt="Aperçu">
            
            <button id="btn-retake" class="absolute top-4 left-4 glass-panel p-3 rounded-full text-white shadow-lg z-20">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </button>
        </div>

        <div class="px-5 -mt-4 relative z-20">
            <div class="glass-panel rounded-3xl p-6 shadow-2xl">
                
                <div class="mb-6 bg-black/50 p-4 rounded-2xl border border-white/5">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-gray-300">Sérieux</span>
                        <span class="text-xs font-bold text-club animate-pulse">Glisse pour le mode FUN 🕶️</span>
                        <span class="text-sm font-medium text-gray-300">FUN</span>
                    </div>
                    <input type="range" id="fun-slider" min="0" max="150" value="0">
                </div>

                <div class="text-center mb-5">
                    <span class="inline-block bg-white/10 text-club text-xs font-bold px-3 py-1 rounded-full mb-2 uppercase tracking-wide">Story Time</span>
                    <h2 class="text-xl font-bold leading-tight">🔥 Tag <span id="display-ig" class="text-club"></span> pour être reposté !</h2>
                </div>

                <button id="btn-share" class="w-full bg-gradient-to-r from-club to-rose-600 text-white font-bold py-4 rounded-2xl mb-3 shadow-[0_0_15px_rgba(255,42,95,0.5)] transform active:scale-95 transition-transform flex items-center justify-center gap-2 text-lg">
                    🚀 Partager ma Story Instagram
                </button>

                <button id="btn-copy-tags" class="w-full bg-white/5 hover:bg-white/10 border border-white/10 text-white font-medium py-3 rounded-xl mb-4 transition-colors flex items-center justify-center gap-2">
                    📋 <span id="copy-text">Copier les tags du club</span>
                </button>

                <button id="btn-save" class="w-full text-gray-400 hover:text-white text-sm py-2 underline flex justify-center items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                    Sauvegarder l'image
                </button>
            </div>
        </div>
    </main>

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full shadow-2xl z-50 transition-all duration-300 opacity-0 translate-y-[-20px] pointer-events-none">
        <span id="toast-message">✅ Copié avec succès !</span>
    </div>

    <!-- CANVAS CACHÉ -->
    <canvas id="render-canvas" width="1080" height="1920" class="hidden"></canvas>

    <!-- LOGIQUE JAVASCRIPT -->
    <script type="module">
        // ÉTAT
        let faceDetector = null;
        let originalImage = null; 
        let currentFaces = [];
        let isDetecting = false;
        let isAIReady = false;
        let funLevel = 0; 
        
        let cadreImg = new Image();
        let lunettesImg = new Image();

        // DOM
        const screenCapture = document.getElementById('screen-capture');
        const screenResult = document.getElementById('screen-result');
        const screenLoading = document.getElementById('screen-loading');
        const fileInput = document.getElementById('file-input');
        const previewImage = document.getElementById('preview-image');
        const canvas = document.getElementById('render-canvas');
        const ctx = canvas.getContext('2d');
        const loadingText = document.getElementById('loading-text');
        const funSlider = document.getElementById('fun-slider'); 

        document.getElementById('display-ig').textContent = CONFIG.CLUB_IG;

        // CHARGEMENT IMAGES
        function loadAssets() {
            lunettesImg.src = CONFIG.LUNETTES_URL;
            cadreImg.crossOrigin = "anonymous";
            cadreImg.onerror = () => {
                const tempCanvas = document.createElement('canvas');
                tempCanvas.width = 1080; tempCanvas.height = 1920;
                const tCtx = tempCanvas.getContext('2d');
                tCtx.fillStyle = 'rgba(0,0,0,0.4)';
                tCtx.fillRect(0, 1600, 1080, 320);
                tCtx.fillStyle = '#ff2a5f';
                tCtx.font = 'bold 80px sans-serif';
                tCtx.textAlign = 'center';
                tCtx.fillText(CONFIG.CLUB_NAME, 540, 1720);
                tCtx.fillStyle = '#ffffff';
                tCtx.font = '50px sans-serif';
                tCtx.fillText(CONFIG.CLUB_TAGS, 540, 1800);
                cadreImg.src = tempCanvas.toDataURL();
            };
            cadreImg.src = CONFIG.CADRE_URL;
        }
        loadAssets();

        // --- LE COEUR DU CORRECTIF IPHONE (ANTI-JETSAM) ---
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            showLoading("Création de l'image...");
            
            // LA MAGIE EST ICI : On attend 600ms que l'iPhone ferme complètement 
            // la caméra et libère la RAM en arrière-plan avant de traiter l'image.
            setTimeout(() => {
                const imgUrl = URL.createObjectURL(file);
                const img = new Image();
                
                img.onload = () => {
                    originalImage = img;
                    URL.revokeObjectURL(imgUrl); // Vide la RAM
                    
                    renderFinalImage();
                    
                    hideLoading();
                    screenCapture.classList.add('hidden');
                    screenResult.classList.remove('hidden');
                };
                img.src = imgUrl;
            }, 600);
        });

        // --- IA DYNAMIQUE ---
        async function initAndDetectFaces() {
            if (isAIReady && currentFaces.length > 0) return true;
            if (isDetecting) return false;
            
            isDetecting = true;
            showLoading("Activation du mode FUN... 🕶️");
            
            try {
                if (!faceDetector) {
                    loadingText.textContent = "Téléchargement IA...";
                    
                    // Import dynamique : Le code IA n'existe pas tant qu'on ne glisse pas le curseur.
                    const mediapipe = await import("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js");
                    
                    loadingText.textContent = "Démarrage moteur...";
                    const vision = await mediapipe.FilesetResolver.forVisionTasks(
                        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                    );
                    
                    faceDetector = await mediapipe.FaceDetector.createFromOptions(vision, {
                        baseOptions: {
                            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite",
                            delegate: "CPU"
                        },
                        runningMode: "IMAGE"
                    });
                }
                
                loadingText.textContent = "Recherche des visages...";
                
                // ASTUCE MEMOIRE N°2 : On réduit la photo en 1024px maximum 
                // pour que l'IA l'analyse 10x plus vite sans saturer le téléphone.
                const aiCanvas = document.createElement('canvas');
                const scale = Math.min(1, 1024 / Math.max(originalImage.width, originalImage.height));
                aiCanvas.width = originalImage.width * scale;
                aiCanvas.height = originalImage.height * scale;
                const aiCtx = aiCanvas.getContext('2d');
                aiCtx.drawImage(originalImage, 0, 0, aiCanvas.width, aiCanvas.height);
                
                const detections = faceDetector.detect(aiCanvas);
                currentFaces = detections.detections || [];
                
                isAIReady = true;
                hideLoading();
                isDetecting = false;
                return true;
            } catch (error) {
                console.error("Erreur IA MediaPipe:", error);
                showToastError("Impossible d'activer l'IA. Vérifiez votre connexion.");
                hideLoading();
                isDetecting = false;
                return false;
            }
        }

        // --- RENDU CANVAS ---
        function renderFinalImage() {
            const C_WIDTH = 1080;
            const C_HEIGHT = 1920;
            ctx.clearRect(0, 0, C_WIDTH, C_HEIGHT);
            if (!originalImage) return;

            const imgRatio = originalImage.width / originalImage.height;
            const canvasRatio = C_WIDTH / C_HEIGHT;
            let drawWidth, drawHeight, offsetX = 0, offsetY = 0;

            if (imgRatio > canvasRatio) {
                drawHeight = C_HEIGHT;
                drawWidth = originalImage.height * canvasRatio;
                offsetX = (originalImage.width - drawWidth) / 2;
            } else {
                drawWidth = originalImage.width;
                drawHeight = originalImage.width / canvasRatio;
                offsetY = (originalImage.height - drawHeight) / 2;
            }

            ctx.drawImage(originalImage, offsetX, offsetY, drawWidth, drawHeight, 0, 0, C_WIDTH, C_HEIGHT);

            const scaleX = C_WIDTH / drawWidth;
            const scaleY = C_HEIGHT / drawHeight;

            if (funLevel > 0 && currentFaces.length > 0) {
                const sizeMultiplier = 0.5 + (funLevel / 100);

                currentFaces.forEach(face => {
                    if(!face.keypoints || face.keypoints.length < 2) return;

                    const rightEyeNorm = face.keypoints[0];
                    const leftEyeNorm = face.keypoints[1];

                    const rxSource = rightEyeNorm.x * originalImage.width;
                    const rySource = rightEyeNorm.y * originalImage.height;
                    const lxSource = leftEyeNorm.x * originalImage.width;
                    const lySource = leftEyeNorm.y * originalImage.height;

                    const rxCanvas = (rxSource - offsetX) * scaleX;
                    const ryCanvas = (rySource - offsetY) * scaleY;
                    const lxCanvas = (lxSource - offsetX) * scaleX;
                    const lyCanvas = (lySource - offsetY) * scaleY;

                    const dx = lxCanvas - rxCanvas;
                    const dy = lyCanvas - ryCanvas;
                    const angle = Math.atan2(dy, dx);
                    const distance = Math.sqrt(dx*dx + dy*dy);

                    const glassesWidth = distance * 2.8 * sizeMultiplier;
                    const glassesHeight = glassesWidth * (lunettesImg.height / lunettesImg.width);

                    const centerX = (rxCanvas + lxCanvas) / 2;
                    const centerY = (ryCanvas + lyCanvas) / 2;

                    ctx.save();
                    ctx.translate(centerX, centerY);
                    ctx.rotate(angle);
                    ctx.drawImage(lunettesImg, -glassesWidth/2, -glassesHeight/2, glassesWidth, glassesHeight);
                    ctx.restore();
                });
            }

            if (cadreImg.complete && cadreImg.naturalWidth !== 0) {
                ctx.drawImage(cadreImg, 0, 0, C_WIDTH, C_HEIGHT);
            }

            previewImage.src = canvas.toDataURL('image/png', 0.9);
        }

        let animationFrameId;
        function updateRender() {
            renderFinalImage();
            animationFrameId = requestAnimationFrame(updateRender);
        }

        // --- INTERACTIONS ---
        if (funSlider) {
            funSlider.addEventListener('input', async (e) => {
                const val = parseInt(e.target.value);
                
                if (val > 0 && !isAIReady) {
                    if (!isDetecting) {
                        const success = await initAndDetectFaces();
                        if (success) {
                            funLevel = parseInt(funSlider.value);
                            renderFinalImage();
                        } else {
                            funSlider.value = 0;
                            funLevel = 0;
                        }
                    }
                    return; 
                }
                
                funLevel = val;
                if (isAIReady && !animationFrameId) {
                    updateRender();
                }
            });

            funSlider.addEventListener('change', () => {
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                    animationFrameId = null;
                }
                renderFinalImage(); 
            });
        }

        document.getElementById('btn-share').addEventListener('click', async () => {
            const dataUrl = previewImage.src;
            try {
                const res = await fetch(dataUrl);
                const blob = await res.blob();
                const file = new File([blob], 'workout-story.png', { type: 'image/png' });
                
                const shareData = {
                    title: CONFIG.CLUB_NAME,
                    text: `Fin de séance ! 🔥 Rejoignez-moi chez ${CONFIG.CLUB_IG} ${CONFIG.CLUB_TAGS}`,
                    files: [file]
                };

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share(shareData);
                } else {
                    triggerDownload(dataUrl);
                }
            } catch (err) {
                if (err.name !== 'AbortError') triggerDownload(dataUrl);
            }
        });

        document.getElementById('btn-copy-tags').addEventListener('click', async () => {
            const textToCopy = `${CONFIG.CLUB_IG} ${CONFIG.CLUB_TAGS}`;
            try {
                await navigator.clipboard.writeText(textToCopy);
                showToast("✅ Copié avec succès !");
            } catch (err) {
                const tempInput = document.createElement("input");
                tempInput.value = textToCopy;
                document.body.appendChild(tempInput);
                tempInput.select();
                document.execCommand("copy");
                document.body.removeChild(tempInput);
                showToast("✅ Copié avec succès !");
            }
        });

        document.getElementById('btn-retake').addEventListener('click', () => {
            fileInput.value = '';
            originalImage = null;
            previewImage.src = '';
            currentFaces = [];
            funLevel = 0;
            if (funSlider) funSlider.value = 0;
            screenResult.classList.add('hidden');
            screenCapture.classList.remove('hidden');
        });

        document.getElementById('btn-save').addEventListener('click', () => {
            triggerDownload(previewImage.src);
        });

        function showLoading(text) {
            loadingText.textContent = text;
            screenLoading.classList.remove('hidden');
        }

        function hideLoading() {
            screenLoading.classList.add('hidden');
        }

        function triggerDownload(dataUrl) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = `Selfie-${CONFIG.CLUB_NAME.replace(/\s+/g, '')}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toastMessage.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            if (message.includes("Copié")) {
                const btnText = document.getElementById('copy-text');
                btnText.textContent = "Copié !";
                setTimeout(() => { btnText.textContent = "Copier les tags du club"; }, 2500);
            }

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
            }, 2500);
        }

        function showToastError(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            toast.classList.replace('bg-green-500', 'bg-red-500');
            toastMessage.textContent = "⚠️ " + message;
            toast.classList.remove('opacity-0', 'translate-y-[-20px]');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-20px]');
                setTimeout(() => { toast.classList.replace('bg-red-500', 'bg-green-500'); }, 300);
            }, 3500);
        }
    </script>
</body>
</html>
